# Netlify configuration
#
# There is no build step. Netlify publishes the folder exactly as it is, which
# is the whole point: a change to a CSS file is live a minute after the push,
# and there is nothing that can fail at 11pm in a hotel room.

[build]
  publish = "."
  command = ""

[build.processing]
  skip_processing = true

# Hash routing means every URL is really index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # This is a family site, not a public one. Keep it out of search results.
    X-Robots-Tag = "noindex, nofollow, noarchive, nosnippet"

[[headers]]
  for = "/data/*.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
