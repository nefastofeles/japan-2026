<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Simple map showing Tokyo Bay filled to make new land at Tsukiji">
  <rect width="1600" height="900" fill="#FAF8F3"/>
  <rect x="0" y="0" width="1600" height="16" fill="#BC002D"/>
  <rect x="0" y="884" width="1600" height="16" fill="#BC002D"/>
  
        <path d="M120 160 C 400 80, 700 180, 900 140 L 900 760 L 120 760 Z" fill="#7BA7C9"/>
        <path d="M900 220 L 1480 180 L 1480 760 L 900 760 Z" fill="#E6D7B8"/>
