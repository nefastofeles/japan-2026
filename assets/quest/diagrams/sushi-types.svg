  <rect x="0" y="0" width="1600" height="16" fill="#BC002D"/>
  <rect x="0" y="884" width="1600" height="16" fill="#BC002D"/>
  
        <g font-family="Georgia, serif" font-size="26" text-anchor="middle" fill="#1A1610">
          <ellipse cx="170" cy="430" rx="110" ry="70" fill="#F2E4C8" stroke="#1A1610"/>
          <rect x="130" y="390" width="80" height="40" rx="8" fill="#F4C7C3"/>
          <rect x="140" y="418" width="60" height="22" fill="#FAF8F3"/>
          <text x="170" y="560">nigiri</text>
          <ellipse cx="470" cy="430" rx="110" ry="70" fill="#F2E4C8" stroke="#1A1610"/>
          <circle cx="470" cy="430" r="36" fill="#6B8F71"/>
          <circle cx="470" cy="430" r="18" fill="#FAF8F3"/>
