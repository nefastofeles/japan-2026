<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="A wooden government noticeboard by a post-town street">
  <rect width="1600" height="900" fill="#FAF8F3"/>
  <rect x="0" y="0" width="1600" height="16" fill="#BC002D"/>
  <rect x="520" y="140" width="560" height="620" fill="#8C6A3A" stroke="#1A1610" stroke-width="6"/>
  <rect x="560" y="180" width="480" height="520" fill="#E6D7B8"/>
  <line x1="600" y1="260" x2="1000" y2="260" stroke="#1A1610" stroke-width="8"/>
