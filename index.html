  <!-- Paint Quest red before the router boots so #/adventure is not a teal flash. -->
  <script>
    (function () {
      function syncQuestShell() {
        document.documentElement.toggleAttribute(
          "data-quest",
          location.hash.startsWith("#/adventure")
        );
      }
      syncQuestShell();
      window.addEventListener("hashchange", syncQuestShell);
    })();
  </script>
